name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install dependencies
      run: |
        npm install --legacy-peer-deps
        npm install -g react-native-cli
    
    - name: Clean duplicate files
      run: |
        # Remove duplicate masterapptemp package
        rm -rf android/app/src/main/java/com/masterapptemp || true
        rm -rf android/app/src/debug/java/com/masterapptemp || true
        rm -rf android/app/src/release/java/com/masterapptemp || true
    
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MasterApp-debug
        path: android/app/build/outputs/apk/debug/*.apk
        retention-days: 30
