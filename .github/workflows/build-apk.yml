name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Project Name'
        required: true
        default: 'MasterApp'
        type: string
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
      with:
        cmdline-tools-version: 9477386
    
    - name: Install dependencies
      run: |
        npm install --legacy-peer-deps
        npm install -g react-native-cli
    
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
    
    - name: Build Android APK (Debug)
      if: github.event.inputs.build_type == 'debug' || github.event_name == 'push' || github.event_name == 'pull_request'
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
    
    - name: Build Android APK (Release)
      if: github.event.inputs.build_type == 'release'
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease
    
    - name: Upload Debug APK
      if: github.event.inputs.build_type == 'debug' || github.event_name == 'push' || github.event_name == 'pull_request'
      uses: actions/upload-artifact@v3
      with:
        name: MasterApp-debug
        path: android/app/build/outputs/apk/debug/*.apk
    
    - name: Upload Release APK
      if: github.event.inputs.build_type == 'release'
      uses: actions/upload-artifact@v3
      with:
        name: MasterApp-release
        path: android/app/build/outputs/apk/release/*.apk
    
    - name: Create Release
      if: github.event.inputs.build_type == 'release'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        draft: false
        prerelease: false
    
    - name: Upload Release Assets
      if: github.event.inputs.build_type == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: android/app/build/outputs/apk/release/*.apk
        asset_name: MasterApp-${{ github.event.inputs.project_name || 'MasterApp' }}.apk
        asset_content_type: application/vnd.android.package-archive
